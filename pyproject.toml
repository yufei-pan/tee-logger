[build-system]
# 77.0.1 is the first setuptools on PyPI that accepts `license` as an SPDX string and
# `license-files` (PEP 639): 76.1.0 rejects the string, and 77.0.0 is not on PyPI.
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tee-logger"
dynamic = ["version"]
description = "A simple wrapper for python logger that also selectively tee logs to stdout"
readme = "README.md"
requires-python = ">=3.6"
dependencies = []
authors = [
    { name = "Yufei Pan", email = "pan@zopyr.us" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.urls]
"Homepage" = "https://github.com/yufei-pan/Tee_Logger"

[tool.setuptools]
py-modules = ["Tee_Logger"]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "Tee_Logger.version"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/Tee_Logger.py"]
pythonpath = ["src"]
addopts = ["--doctest-modules"]
# Restrict doctest collection to the library module (avoid picking up benchmarks):
norecursedirs = [".git", ".venv", "dist", "screenshots"]
markers = [
    "zstd: tests that require compression.zstd (Python 3.14+ with zstd)",
]
