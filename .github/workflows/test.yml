name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    # 24.04, not ubuntu-latest: setup-python has no Python 3.9 for Ubuntu 26.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  # setup-python no longer ships 3.6, so run the oldest supported version in a container.
  # Tests run from src/ (pytest pythonpath); building the package needs setuptools>=61,
  # which requires Python 3.7+, while the published py3-none-any wheel installs fine on 3.6.
  pytest-py36:
    runs-on: ubuntu-24.04
    # by digest: the python:3.6-slim tag gets no updates, and a digest cannot be moved
    container: python:3.6-slim@sha256:2cfebc27956e6a55f78606864d91fe527696f9e32a724e6f9702b5f9602d0474
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest
        run: pip install "pytest<7.1"
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
